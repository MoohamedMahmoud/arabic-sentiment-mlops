stages:

  prepare:

    cmd: uv run python -m arabic_sentiment_mlops.prepare --input data/raw/alldata.csv --output data/processed --seed 42

    deps:

      - data/raw/alldata.csv

      - src/arabic_sentiment_mlops/prepare.py

      - src/arabic_sentiment_mlops/data.py

    outs:

      - data/processed/train.parquet

      - data/processed/val.parquet

      - data/processed/test.parquet

    metrics:

      - data/processed/data_card.json:

          cache: false





  train:

    cmd: uv run python -m arabic_sentiment_mlops.tune

    deps:

      - data/processed/train.parquet

      - data/processed/val.parquet

      - data/processed/test.parquet

      - src/arabic_sentiment_mlops/config.py

      - src/arabic_sentiment_mlops/data.py

      - src/arabic_sentiment_mlops/preprocessing.py

      - src/arabic_sentiment_mlops/evaluate.py

      - src/arabic_sentiment_mlops/mlflow_utils.py

      - src/arabic_sentiment_mlops/train.py

      - src/arabic_sentiment_mlops/tune.py

    metrics:

      - reports/mlflow/lr_1e-5/train_metrics.json:

          cache: false

      - reports/mlflow/lr_3e-5/train_metrics.json:

          cache: false

      - reports/mlflow/epochs_3/train_metrics.json:

          cache: false

      - reports/mlflow/max_length_256/train_metrics.json:

          cache: false

      - reports/mlflow/tuning_sweep_summary.json:

          cache: false
